// 🔧 These plugins are necessary for Android + React Native integration
apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// 🧩 React Native configuration + vector icons setup
react {
    project.ext.vectoricons = [
        iconFontNames: ['MaterialIcons.ttf', 'MaterialCommunityIcons.ttf', 'Ionicons.ttf']
    ]
    apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
    autolinkLibrariesWithApp()  // Automatically link libraries with the app
}

// 🔒 Optional: Controls if Proguard (code minification) is used in release builds
def enableProguardInReleaseBuilds = true

// ⚙️ JS Engine used by React Native when Hermes is disabled
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // 🆔 App package name (namespace)
    namespace "com.awesomeproject"

    defaultConfig {
        applicationId "com.awesomeproject"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
    }

    // 🔑 Signing configuration for release and debug builds
    signingConfigs {
        // 🧰 Debug config (used for development builds)
        // debug {
        //     storeFile file('debug.keystore')
        //     storePassword 'android'
        //     keyAlias 'androiddebugkey'
        //     keyPassword 'android'
        // }

        // 🏁 Release signing configuration (used for Play Store build)
        // 📝 This picks values from gradle.properties file automatically
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        // 🚀 Release build type configuration for production (Play Store)
        release {
            signingConfig signingConfigs.release  // ✅ Changed from debug → release
            minifyEnabled true                    // Compress + optimize code
            shrinkResources true                  // Remove unused resources
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    // 🧱 Create smaller APKs per CPU architecture (to reduce size)
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false
        }
    }

    // ⚖️ Prevent duplicate .so files (library conflicts)
    packagingOptions {
        pickFirst "**/libhermes.so"
    }
}

// 📦 Dependencies used by React Native app
dependencies {
    // React Native Android dependency
    implementation("com.facebook.react:react-android")

    // ⚡ JS Engine (Hermes or JSC)
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
